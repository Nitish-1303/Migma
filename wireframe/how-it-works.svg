<?xml version="1.0" encoding="UTF-8"?>
<!-- Migma x Spotify - how the three-step flow works. 1920x1080 (16:9).
     One illustrated card per stop: Entry, then the three named steps. Line icons are drawn
     paths, so nothing depends on an icon font being present. Geometry is baked from measured
     text metrics with 26% headroom on the descriptions and 11% on the bullets, so platform
     font drift cannot overflow a card. Colours are the wireframe's own tokens: page #0A0A0A,
     raised #141414, canvas #0F0F0F, line #2A2A2A, text #FFFFFF, secondary #E2E2E3,
     tertiary #939393, success #22C55E. -->
<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080" role="img" aria-labelledby="ttl desc">
  <title id="ttl">Migma × Spotify — how it works</title>
  <desc id="desc">Four cards left to right on a connector line: Entry, step 1 Pick a playlist, step 2 Choose and refine, step 3 Save and export. Each card carries an icon, a summary and three details.</desc>

  <rect width="1920" height="1080" fill="#0a0a0a"/>

  <g font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Arial,sans-serif">
    <text x="960" y="190" text-anchor="middle" font-size="52" font-weight="700" fill="#ffffff">How it works</text>
    <text x="960" y="234" text-anchor="middle" font-size="22" font-weight="400" fill="#939393">Playlist to campaign, in three steps, inside the Spotify client.</text>

    <rect x="120" y="294" width="1680" height="644" rx="28" fill="#141414" stroke="#2a2a2a" stroke-width="2"/>

    <!-- connector, then a mask ring per badge so the line reads as broken -->
    <path d="M357 372H1563" stroke="#2a2a2a" stroke-width="2"/>
    <circle cx="357" cy="372" r="26.5" fill="#141414"/>
    <circle cx="759" cy="372" r="26.5" fill="#141414"/>
    <circle cx="1161" cy="372" r="26.5" fill="#141414"/>
    <circle cx="1563" cy="372" r="26.5" fill="#141414"/>
    <circle cx="357" cy="372" r="22" fill="#1e1e1e" stroke="#2a2a2a" stroke-width="2"/>
    <circle cx="357" cy="372" r="3" fill="#939393"/>
    <circle cx="759" cy="372" r="22" fill="#ffffff"/>
    <text x="759" y="379" text-anchor="middle" font-size="20" font-weight="700" fill="#000000">1</text>
    <circle cx="1161" cy="372" r="22" fill="#ffffff"/>
    <text x="1161" y="379" text-anchor="middle" font-size="20" font-weight="700" fill="#000000">2</text>
    <circle cx="1563" cy="372" r="22" fill="#152019" stroke="#22c55e" stroke-width="2"/>
    <text x="1563" y="379" text-anchor="middle" font-size="20" font-weight="700" fill="#22c55e">3</text>

    <!-- ============ Entry ============ -->
    <g transform="translate(176,0)">
      <rect y="430" width="362" height="452" rx="18" fill="#0f0f0f" stroke="#2a2a2a" stroke-width="2"/>
      <rect x="30" y="476" width="64" height="64" rx="16" fill="#191919" stroke="#2a2a2a" stroke-width="1.5"/>
      <g transform="translate(44,490) scale(1.5)" fill="none" stroke="#939393" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <path d="M14 3h5a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-5"/><path d="M10 17l5-5-5-5"/><path d="M15 12H3"/>
      </g>
      <text x="30" y="590" font-size="27" font-weight="700" fill="#ffffff">Entry</text>
      <text x="30" y="632" font-size="19.5" fill="#939393">Three ways in, all landing</text>
      <text x="30" y="664" font-size="19.5" fill="#939393">on the same route.</text>
      <circle cx="38" cy="717.5" r="8" fill="#2a2a2a"/><circle cx="38" cy="717.5" r="4" fill="#939393"/>
      <text x="58" y="724" font-size="19.5" fill="#e2e2e3">Left-nav item</text>
      <circle cx="38" cy="763.5" r="8" fill="#2a2a2a"/><circle cx="38" cy="763.5" r="4" fill="#939393"/>
      <text x="58" y="770" font-size="19.5" fill="#e2e2e3">Topbar button</text>
      <circle cx="38" cy="809.5" r="8" fill="#2a2a2a"/><circle cx="38" cy="809.5" r="4" fill="#939393"/>
      <text x="58" y="816" font-size="19.5" fill="#e2e2e3">Playlist right-click menu</text>
    </g>

    <!-- ============ 1 - Pick a playlist ============ -->
    <g transform="translate(578,0)">
      <rect y="430" width="362" height="452" rx="18" fill="#222222" stroke="#ffffff" stroke-width="2"/>
      <rect x="30" y="476" width="64" height="64" rx="16" fill="#2f2f2f" stroke="#454545" stroke-width="1.5"/>
      <g transform="translate(42.5,487) scale(1.5)" fill="none" stroke="#ffffff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <path d="M3 7h12"/><path d="M3 12h8"/><path d="M3 17h6"/><circle cx="17" cy="18" r="3"/><path d="M20 18V7l3 1.5"/>
      </g>
      <text x="30" y="590" font-size="27" font-weight="700" fill="#ffffff">Pick a playlist</text>
      <text x="30" y="632" font-size="19.5" fill="#939393">Connect, choose a playlist,</text>
      <text x="30" y="664" font-size="19.5" fill="#939393">read its audience.</text>
      <circle cx="38" cy="717.5" r="8" fill="#3d3d3d"/><circle cx="38" cy="717.5" r="4" fill="#ffffff"/>
      <text x="58" y="724" font-size="19.5" fill="#e2e2e3">Your library, read-only</text>
      <circle cx="38" cy="763.5" r="8" fill="#3d3d3d"/><circle cx="38" cy="763.5" r="4" fill="#ffffff"/>
      <text x="58" y="770" font-size="19.5" fill="#e2e2e3">Tracks · runtime · artists</text>
      <circle cx="38" cy="809.5" r="8" fill="#3d3d3d"/><circle cx="38" cy="809.5" r="4" fill="#ffffff"/>
      <text x="58" y="816" font-size="19.5" fill="#e2e2e3">Top genres and release era</text>
    </g>

    <!-- ============ 2 - Choose & refine ============ -->
    <g transform="translate(980,0)">
      <rect y="430" width="362" height="452" rx="18" fill="#222222" stroke="#ffffff" stroke-width="2"/>
      <rect x="30" y="476" width="64" height="64" rx="16" fill="#2f2f2f" stroke="#454545" stroke-width="1.5"/>
      <g transform="translate(44,490) scale(1.5)" fill="none" stroke="#ffffff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <path d="M21 6h-7"/><path d="M10 6H3"/><circle cx="12" cy="6" r="2.2"/>
        <path d="M21 12h-9"/><path d="M8 12H3"/><circle cx="10" cy="12" r="2.2"/>
        <path d="M21 18h-5"/><path d="M12 18H3"/><circle cx="14" cy="18" r="2.2"/>
      </g>
      <text x="30" y="590" font-size="27" font-weight="700" fill="#ffffff">Choose &amp; refine</text>
      <text x="30" y="632" font-size="19.5" fill="#939393">Pick an angle, tune the</text>
      <text x="30" y="664" font-size="19.5" fill="#939393">brief, watch it build.</text>
      <circle cx="38" cy="717.5" r="8" fill="#3d3d3d"/><circle cx="38" cy="717.5" r="4" fill="#ffffff"/>
      <text x="58" y="724" font-size="19.5" fill="#e2e2e3">Three angles to choose from</text>
      <circle cx="38" cy="763.5" r="8" fill="#3d3d3d"/><circle cx="38" cy="763.5" r="4" fill="#ffffff"/>
      <text x="58" y="770" font-size="19.5" fill="#e2e2e3">Brief: tone, length, CTA</text>
      <circle cx="38" cy="809.5" r="8" fill="#3d3d3d"/><circle cx="38" cy="809.5" r="4" fill="#ffffff"/>
      <text x="58" y="816" font-size="19.5" fill="#e2e2e3">Preview updates live</text>
    </g>

    <!-- ============ 3 - Save & export ============ -->
    <g transform="translate(1382,0)">
      <rect y="430" width="362" height="452" rx="18" fill="#152019" stroke="#22c55e" stroke-width="2"/>
      <rect x="30" y="476" width="64" height="64" rx="16" fill="#1c2b21" stroke="#2e4a36" stroke-width="1.5"/>
      <g transform="translate(44,490) scale(1.5)" fill="none" stroke="#22c55e" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <path d="M4 15v4a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-4"/><path d="M12 15V3"/><path d="M7 8l5-5 5 5"/>
      </g>
      <text x="30" y="590" font-size="27" font-weight="700" fill="#ffffff">Save &amp; export</text>
      <text x="30" y="632" font-size="19.5" fill="#939393">Score the campaign, save it,</text>
      <text x="30" y="664" font-size="19.5" fill="#939393">take the receipt.</text>
      <circle cx="38" cy="717.5" r="8" fill="#2e4a36"/><circle cx="38" cy="717.5" r="4" fill="#22c55e"/>
      <text x="58" y="724" font-size="19.5" fill="#e2e2e3">Conversion probability</text>
      <circle cx="38" cy="763.5" r="8" fill="#2e4a36"/><circle cx="38" cy="763.5" r="4" fill="#22c55e"/>
      <text x="58" y="770" font-size="19.5" fill="#e2e2e3">Peak listening window</text>
      <circle cx="38" cy="809.5" r="8" fill="#2e4a36"/><circle cx="38" cy="809.5" r="4" fill="#22c55e"/>
      <text x="58" y="816" font-size="19.5" fill="#e2e2e3">HTML export, merge tokens</text>
    </g>
  </g>
</svg>
