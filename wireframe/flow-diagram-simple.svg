<?xml version="1.0" encoding="UTF-8"?>
<!-- Migma x Spotify - three-step campaign flow, labels only. 1920x1080 (16:9).
     The same pipeline as flow-diagram.svg with the descriptive sub-lines dropped. The ordinal
     is a badge beside the step's name, not part of it - the same treatment the wireframe's flow
     strip and the app's rail give it. Connectors are drawn (rule + chevron) rather than typed,
     so no arrow glyph has to exist in the reader's font. Geometry is baked from measured text
     metrics with at least 9.8% width headroom on every label, so platform font drift cannot
     overflow a box. Colours are the wireframe's own tokens: page #0A0A0A, raised #141414,
     canvas #0F0F0F, line #2A2A2A, text #FFFFFF, tertiary #939393, success #22C55E. -->
<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080" role="img" aria-labelledby="ttl desc">
  <title id="ttl">Migma × Spotify — three-step campaign flow</title>
  <desc id="desc">Entry, then step 1 Pick a playlist, step 2 Choose and refine, step 3 Save and export.</desc>

  <!-- page -->
  <rect width="1920" height="1080" fill="#0a0a0a"/>

  <g font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Arial,sans-serif">
    <!-- container -->
    <rect x="238" y="400" width="1444" height="280" rx="22" fill="#141414" stroke="#2a2a2a" stroke-width="2"/>

    <!-- Entry - dark surface, subtle line; the badge is a dot, not an ordinal -->
    <rect x="286" y="492" width="204" height="96" rx="14" fill="#0f0f0f" stroke="#2a2a2a" stroke-width="2"/>
    <circle cx="331" cy="540" r="17" fill="#141414" stroke="#2a2a2a" stroke-width="2"/>
    <circle cx="331" cy="540" r="3" fill="#939393"/>
    <text x="364" y="550" font-size="28" font-weight="700" fill="#ffffff">Entry</text>

    <g fill="none" stroke="#939393" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M496 540H530"/><path d="M530 533l10 7-10 7"/>
    </g>

    <!-- Step 1 - active, white outline -->
    <rect x="546" y="492" width="312" height="96" rx="14" fill="#222222" stroke="#ffffff" stroke-width="2"/>
    <circle cx="591" cy="540" r="17" fill="#ffffff"/>
    <text x="591" y="546.5" text-anchor="middle" font-size="19" font-weight="700" fill="#000000">1</text>
    <text x="624" y="550" font-size="28" font-weight="700" fill="#ffffff">Pick a playlist</text>

    <g fill="none" stroke="#939393" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M864 540H898"/><path d="M898 533l10 7-10 7"/>
    </g>

    <!-- Step 2 - active, white outline -->
    <rect x="914" y="492" width="344" height="96" rx="14" fill="#222222" stroke="#ffffff" stroke-width="2"/>
    <circle cx="959" cy="540" r="17" fill="#ffffff"/>
    <text x="959" y="546.5" text-anchor="middle" font-size="19" font-weight="700" fill="#000000">2</text>
    <text x="992" y="550" font-size="28" font-weight="700" fill="#ffffff">Choose &amp; refine</text>

    <g fill="none" stroke="#939393" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M1264 540H1298"/><path d="M1298 533l10 7-10 7"/>
    </g>

    <!-- Step 3 - terminal, emerald outline -->
    <rect x="1314" y="492" width="320" height="96" rx="14" fill="#152019" stroke="#22c55e" stroke-width="2"/>
    <circle cx="1359" cy="540" r="17" fill="#173a24" stroke="#1c733c" stroke-width="2"/>
    <text x="1359" y="546.5" text-anchor="middle" font-size="19" font-weight="700" fill="#22c55e">3</text>
    <text x="1392" y="550" font-size="28" font-weight="700" fill="#ffffff">Save &amp; export</text>
  </g>
</svg>
