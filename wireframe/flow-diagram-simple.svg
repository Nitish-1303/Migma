<?xml version="1.0" encoding="UTF-8"?>
<!-- Migma x Spotify - three-step campaign flow, labels only. 1920x1080 (16:9).
     The same pipeline as flow-diagram.svg with the descriptive sub-lines dropped.
     Geometry is baked from measured font metrics, so the boxes fit their text on any platform.
     Colours are the wireframe's own tokens: page #0A0A0A, raised #141414, canvas #0F0F0F,
     line #2A2A2A, text #FFFFFF, text-tertiary #939393, success #22C55E. -->
<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080" role="img" aria-labelledby="ttl desc">
  <title id="ttl">Migma × Spotify — three-step campaign flow</title>
  <desc id="desc">Entry, then step 1 Pick a playlist, step 2 Choose and refine, step 3 Save and export.</desc>

  <!-- page -->
  <rect width="1920" height="1080" fill="#0a0a0a"/>

  <!-- container -->
  <rect x="301" y="400" width="1318" height="280" rx="22" fill="#141414" stroke="#2a2a2a" stroke-width="2"/>

  <!-- Entry - dark surface, subtle line -->
  <rect x="349" y="492" width="130" height="96" rx="14" fill="#0f0f0f" stroke="#2a2a2a" stroke-width="2"/>
  <text x="414" y="551.5" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Arial,sans-serif" font-size="28" font-weight="700" fill="#ffffff">Entry</text>

  <text x="512" y="549" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Arial,sans-serif" font-size="30" font-weight="400" fill="#939393">→</text>

  <!-- Step 1 - active, white outline -->
  <rect x="545" y="492" width="284" height="96" rx="14" fill="#222222" stroke="#ffffff" stroke-width="2"/>
  <text x="687" y="551.5" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Arial,sans-serif" font-size="28" font-weight="700" fill="#ffffff">1 · Pick a playlist</text>

  <text x="862" y="549" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Arial,sans-serif" font-size="30" font-weight="400" fill="#939393">→</text>

  <!-- Step 2 - active, white outline -->
  <rect x="895" y="492" width="318" height="96" rx="14" fill="#222222" stroke="#ffffff" stroke-width="2"/>
  <text x="1054" y="551.5" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Arial,sans-serif" font-size="28" font-weight="700" fill="#ffffff">2 · Choose &amp; refine</text>

  <text x="1246" y="549" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Arial,sans-serif" font-size="30" font-weight="400" fill="#939393">→</text>

  <!-- Step 3 - terminal, emerald outline -->
  <rect x="1279" y="492" width="292" height="96" rx="14" fill="#152019" stroke="#22c55e" stroke-width="2"/>
  <text x="1425" y="551.5" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Arial,sans-serif" font-size="28" font-weight="700" fill="#ffffff">3 · Save &amp; export</text>
</svg>
