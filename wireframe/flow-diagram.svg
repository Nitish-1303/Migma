<?xml version="1.0" encoding="UTF-8"?>
<!-- Migma x Spotify - three-step campaign flow. 1920x1080 (16:9).
     The ordinal is a badge beside the step's name, not part of it - the same treatment the
     wireframe's flow strip and the app's rail give it. Connectors are drawn (rule + chevron)
     rather than typed, so no arrow glyph has to exist in the reader's font. Geometry is baked
     from measured text metrics with at least 7.6% width headroom on every label, so platform
     font drift cannot overflow a box. Colours are the wireframe's own tokens: page #0A0A0A,
     raised #141414, canvas #0F0F0F, line #2A2A2A, text #FFFFFF, tertiary #939393,
     success #22C55E. -->
<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080" role="img" aria-labelledby="ttl desc">
  <title id="ttl">Migma × Spotify — three-step campaign flow</title>
  <desc id="desc">A left-to-right pipeline: Entry, then step 1 Pick a playlist, step 2 Choose and refine, step 3 Save and export.</desc>

  <!-- page -->
  <rect width="1920" height="1080" fill="#0a0a0a"/>

  <g font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Arial,sans-serif">
    <!-- container -->
    <rect x="128" y="368" width="1664" height="344" rx="22" fill="#141414" stroke="#2a2a2a" stroke-width="2"/>

    <!-- Entry - dark surface, subtle line; the badge is a dot, not an ordinal -->
    <rect x="176" y="478" width="300" height="124" rx="14" fill="#0f0f0f" stroke="#2a2a2a" stroke-width="2"/>
    <circle cx="221" cy="524.5" r="17" fill="#141414" stroke="#2a2a2a" stroke-width="2"/>
    <circle cx="221" cy="524.5" r="3" fill="#939393"/>
    <text x="254" y="534.5" font-size="28" font-weight="700" fill="#ffffff">Entry</text>
    <text x="204" y="570.5" font-size="21" font-weight="400" fill="#939393">nav · topbar · right-click</text>

    <g fill="none" stroke="#939393" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M482 540H516"/><path d="M516 533l10 7-10 7"/>
    </g>

    <!-- Step 1 - active, white outline -->
    <rect x="532" y="478" width="436" height="124" rx="14" fill="#222222" stroke="#ffffff" stroke-width="2"/>
    <circle cx="577" cy="524.5" r="17" fill="#ffffff"/>
    <text x="577" y="531" text-anchor="middle" font-size="19" font-weight="700" fill="#000000">1</text>
    <text x="610" y="534.5" font-size="28" font-weight="700" fill="#ffffff">Pick a playlist</text>
    <text x="560" y="570.5" font-size="21" font-weight="400" fill="#939393">connect · choose · read the audience</text>

    <g fill="none" stroke="#939393" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M974 540H1008"/><path d="M1008 533l10 7-10 7"/>
    </g>

    <!-- Step 2 - active, white outline -->
    <rect x="1024" y="478" width="344" height="124" rx="14" fill="#222222" stroke="#ffffff" stroke-width="2"/>
    <circle cx="1069" cy="524.5" r="17" fill="#ffffff"/>
    <text x="1069" y="531" text-anchor="middle" font-size="19" font-weight="700" fill="#000000">2</text>
    <text x="1102" y="534.5" font-size="28" font-weight="700" fill="#ffffff">Choose &amp; refine</text>
    <text x="1052" y="570.5" font-size="21" font-weight="400" fill="#939393">angle · brief · live preview</text>

    <g fill="none" stroke="#939393" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M1374 540H1408"/><path d="M1408 533l10 7-10 7"/>
    </g>

    <!-- Step 3 - terminal, emerald outline -->
    <rect x="1424" y="478" width="320" height="124" rx="14" fill="#152019" stroke="#22c55e" stroke-width="2"/>
    <circle cx="1469" cy="524.5" r="17" fill="#173a24" stroke="#1c733c" stroke-width="2"/>
    <text x="1469" y="531" text-anchor="middle" font-size="19" font-weight="700" fill="#22c55e">3</text>
    <text x="1502" y="534.5" font-size="28" font-weight="700" fill="#ffffff">Save &amp; export</text>
    <text x="1452" y="570.5" font-size="21" font-weight="400" fill="#939393">score · save · receipt</text>
  </g>
</svg>
